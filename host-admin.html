<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050d"><meta name="robots" content="noindex">
<title>Godfather EA — Admin</title>
<style>
:root{--bg:#07050d;--card:#100b1c;--card2:#160f27;--line:#2a1c47;--p:#a53cff;--p2:#d54bff;--txt:#f1ecfb;--mut:#8f84a8;--ok:#31e08a;--bad:#ff3b57;--glow:0 0 18px rgba(165,60,255,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(120% 50% at 50% -10%,#3a0f6b,transparent 60%),var(--bg);padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}
.w{max-width:560px;margin:0 auto}
h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
input[type=text],input[type=password],input[type=email],input[type=number],select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#0b0714;color:var(--txt);font:inherit;margin-bottom:12px;outline:none}
input:focus,select:focus{border-color:var(--p);box-shadow:var(--glow)}
.btn{width:100%;padding:16px;border-radius:16px;border:0;font:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#b24dff,#7a1fd0);box-shadow:var(--glow);cursor:pointer}
.btn:disabled{opacity:.4;box-shadow:none}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;letter-spacing:.06em}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.plan{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:#0b0714;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;position:relative}
.plan.on{border-color:var(--p2);color:#fff;background:#26104a;box-shadow:var(--glow)}
.plan.best{grid-column:span 3}.plan small{display:block;font-size:9px;letter-spacing:.14em;color:var(--p2)}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{flex:1;padding:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}.tab.on{border-color:var(--p);color:#fff;background:#26104a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:#0b0714;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}.stats small{color:var(--mut);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.out{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.06em;text-align:center;padding:16px;border:1px dashed var(--p);border-radius:14px;margin-bottom:12px;word-break:break-all}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}.row .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut);display:block;margin-top:2px}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:#fff;font:inherit;font-size:12px;cursor:pointer}
.on-t{color:var(--ok)}.off-t{color:var(--bad)}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-bottom:14px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#26104a;border:1px solid var(--p);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}#toast.on{opacity:1}
</style></head>
<body><div class="w">
<h1>Godfather EA — Admin</h1>

<div id="login" class="card">
  <p class="lbl">Server URL</p><input id="srv" type="text" placeholder="https://your-server.example.com" autocomplete="off">
  <p class="lbl">Admin token</p><input id="tok" type="password" placeholder="Admin token" autocomplete="off">
  <div class="err" id="lerr"></div><button class="btn" id="go">Continue</button>
</div>

<div id="main" class="hide">
  <div class="tabs"><button class="tab on" data-t="gen">Licence keys</button><button class="tab" data-t="rob">Robots</button><button class="tab" data-t="men">Mentors</button><button class="tab" data-t="all">All keys</button></div>

  <div id="t-gen">
    <div class="card">
      <p class="lbl">Generate licence key</p>
      <input id="client" type="text" placeholder="Client name" autocomplete="off">
      <select id="ea"><option value="">Select Expert Advisor…</option><option value="__new">＋ Add a new EA</option></select>
      <input id="mentor" type="email" placeholder="Mentor email (optional)" autocomplete="off">
      <p class="lbl">Subscription</p>
      <div class="plans" id="plans">
        <button class="plan" data-p="3d">3 days</button><button class="plan" data-p="5d">5 days</button><button class="plan" data-p="30d">30 days</button>
        <button class="plan" data-p="3m">3 months</button><button class="plan" data-p="6m">6 months</button><button class="plan" data-p="1y">1 year</button>
        <button class="plan best" data-p="lifetime"><small>BEST VALUE</small>Lifetime</button>
      </div>
      <label class="ck"><input type="checkbox" id="conf"> I confirm the client and plan are correct. The key is single-use.</label>
      <button class="btn" id="gen" disabled>Generate licence key</button>
    </div>
    <div class="card hide" id="outc"><p class="lbl">Licence key</p><div class="out" id="out"></div>
      <button class="btn" id="copy">Copy key</button><button class="btn ghost" id="mail" style="margin-top:10px">Draft email</button></div>
  </div>

  <div id="t-rob" class="hide">
    <div class="card"><p class="lbl">Add a new EA</p>
      <input id="rname" type="text" placeholder="EA name" autocomplete="off">
      <input id="rauthor" type="text" placeholder="Author (optional)" autocomplete="off">
      <p class="lbl">Platform</p>
      <div class="plans" style="grid-template-columns:1fr 1fr"><button class="plan on" data-pl="MT5">MT5</button><button class="plan" data-pl="MT4">MT4</button></div>
      <p class="lbl">Cover image (optional)</p>
      <input id="rcover" type="file" accept="image/*" style="margin-bottom:12px;color:var(--mut)">
      <img id="rprev" alt="" style="display:none;width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px">
      <button class="btn" id="radd">Add EA</button></div>
    <div class="card"><p class="lbl">Your EAs</p><div id="rlist"></div></div>
  </div>

  <div id="t-men" class="hide">
    <div class="card"><p class="lbl">Generate Mentor ID</p>
      <input id="memail" type="email" placeholder="Mentor email" autocomplete="off">
      <button class="btn" id="mgen">Generate Mentor ID</button>
      <div class="out hide" id="mout" style="margin-top:12px;margin-bottom:0"></div></div>
    <div class="card"><div class="stats"><div><b id="sT">0</b><small>Total</small></div><div><b id="sA">0</b><small>Active</small></div><div><b id="sD">0</b><small>Deactivated</small></div></div>
      <div class="tabs"><button class="tab on" data-f="all">All</button><button class="tab" data-f="act">Active</button><button class="tab" data-f="off">Deactivated</button></div>
      <div id="mlist"></div></div>
  </div>

  <div id="t-all" class="hide"><div class="card"><div id="klist"></div></div></div>
  <button class="btn ghost" id="out2" style="margin-top:8px">Sign out</button>
</div>
<div id="toast"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let SRV=ls.get('gfa_srv'),TOK='',plan='',mf='all',lastKey='';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,method='GET',body){
  const r=await fetch(SRV+path,{method,headers:{'Content-Type':'application/json','X-Admin':TOK},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
$('#srv').value=SRV;
$('#go').onclick=async()=>{
  SRV=$('#srv').value.trim().replace(/\/$/,'');TOK=$('#tok').value;$('#lerr').textContent='';
  if(!/^https?:\/\//.test(SRV)||!TOK){$('#lerr').textContent='Enter the server URL and admin token.';return}
  try{await api('/admin/keys');ls.set('gfa_srv',SRV);$('#login').classList.add('hide');$('#main').classList.remove('hide');$('#tok').value='';loadRobots();loadMentors();loadKeys()}
  catch(e){TOK='';$('#lerr').textContent=e.message==='Unauthorized'?'Wrong admin token.':'Cannot reach server.'}};
$('#out2').onclick=()=>{TOK='';$('#main').classList.add('hide');$('#login').classList.remove('hide')};
$$('.tabs:first-child .tab[data-t]').forEach(b=>b.onclick=()=>{$$('.tab[data-t]').forEach(x=>x.classList.toggle('on',x===b));['gen','rob','men','all'].forEach(t=>$('#t-'+t).classList.toggle('hide',t!==b.dataset.t))});
/* generate */
const upd=()=>$('#gen').disabled=!(plan&&$('#client').value.trim()&&$('#ea').value&&$('#ea').value!=='__new'&&$('#conf').checked);
$$('.plan').forEach(b=>b.onclick=()=>{plan=b.dataset.p;$$('.plan').forEach(x=>x.classList.toggle('on',x===b));upd()});
['client','conf','ea'].forEach(i=>$('#'+i).addEventListener('input',upd));
$('#ea').addEventListener('change',()=>{if($('#ea').value==='__new'){$('#ea').value='';$$('.tab[data-t]').find(x=>x.dataset.t==='rob').click()}upd()});
/* robots */
let robots={},rplat='MT5',rcover='';
$$('[data-pl]').forEach(b=>b.onclick=()=>{rplat=b.dataset.pl;$$('[data-pl]').forEach(x=>x.classList.toggle('on',x===b))});
$('#rcover').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=480,sc=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rcover=c.toDataURL('image/jpeg',.8);const p=$('#rprev');p.src=rcover;p.style.display='block';URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
async function loadRobots(){try{robots=(await api('/admin/robots')).robots;renderR()}catch(e){}}
function renderR(){const e=Object.entries(robots);
  $('#rlist').innerHTML=e.length?e.sort((a,b)=>b[1].created-a[1].created).map(([id,r])=>`<div class="row">${r.cover?`<img src="${r.cover}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover">`:''}<div class="m"><b>${esc(r.name)}</b><small>${esc(r.author||'—')} · ${r.platform} · <span class="${r.active?'on-t':'off-t'}">${r.active?'Active':'Disabled'}</span></small></div><button class="pill" data-r="${id}">${r.active?'Disable':'Enable'}</button></div>`).join(''):'<p class="lbl">No EAs yet</p>';
  const cur=$('#ea').value;$('#ea').innerHTML='<option value="">Select Expert Advisor…</option>'+e.filter(([,r])=>r.active).map(([id,r])=>`<option value="${id}">${esc(r.name)} (${r.platform})</option>`).join('')+'<option value="__new">＋ Add a new EA</option>';$('#ea').value=robots[cur]?cur:'';upd()}
$('#radd').onclick=async()=>{try{await api('/admin/robots','POST',{name:$('#rname').value,author:$('#rauthor').value,platform:rplat,cover:rcover});$('#rname').value='';$('#rauthor').value='';$('#rcover').value='';rcover='';$('#rprev').style.display='none';toast('EA added');loadRobots()}catch(e){toast(e.message)}};
$('#gen').onclick=async()=>{try{
  const r=await api('/admin/keys','POST',{client:$('#client').value.trim(),robotId:$('#ea').value,plan,mentorEmail:$('#mentor').value.trim()});
  lastKey=r.keys[0];$('#out').textContent=lastKey;$('#outc').classList.remove('hide');$('#conf').checked=false;upd();loadKeys();toast('Key generated')}catch(e){toast(e.message)}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastKey);toast('Copied')}catch(e){toast('Copy failed — select the key manually')}};
$('#mail').onclick=()=>{const c=$('#client').value.trim();location.href='mailto:?subject='+encodeURIComponent('Your Godfather-EA licence key')+'&body='+encodeURIComponent(`Hi ${c},\n\nYour licence key: ${lastKey}\n\nOpen the Godfather-EA app and enter it once to activate. The key is single-use.\n`)};
/* mentors */
let mentors={};
async function loadMentors(){try{mentors=(await api('/admin/mentors')).mentors;renderM()}catch(e){}}
function renderM(){const e=Object.entries(mentors),a=e.filter(([,m])=>m.active).length;$('#sT').textContent=e.length;$('#sA').textContent=a;$('#sD').textContent=e.length-a;
  const v=e.filter(([,m])=>mf==='all'||(mf==='act')===m.active).sort((x,y)=>y[1].created-x[1].created);
  $('#mlist').innerHTML=v.length?v.map(([id,m])=>`<div class="row"><div class="m"><b>${esc(m.email)}</b><small>${id} · <span class="${m.active?'on-t':'off-t'}">${m.active?'Active':'Deactivated'}</span></small></div><button class="pill" data-m="${id}">${m.active?'Deactivate':'Activate'}</button></div>`).join(''):'<p class="lbl">None</p>'}
$$('[data-f]').forEach(b=>b.onclick=()=>{mf=b.dataset.f;$$('[data-f]').forEach(x=>x.classList.toggle('on',x===b));renderM()});
$('#mgen').onclick=async()=>{try{const r=await api('/admin/mentors','POST',{email:$('#memail').value});const o=$('#mout');o.textContent=r.id;o.classList.remove('hide');toast(r.existing?'Mentor already exists':'Mentor ID created');$('#memail').value='';loadMentors()}catch(e){toast(e.message)}};
document.addEventListener('click',async e=>{const rb=e.target.closest('[data-r]');if(rb){const id=rb.dataset.r;try{await api(`/admin/robots/${id}/toggle`,'POST',{active:!robots[id].active});loadRobots()}catch(x){toast(x.message)}}
  const b=e.target.closest('[data-m]');if(b){const id=b.dataset.m;try{await api(`/admin/mentors/${id}/toggle`,'POST',{active:!mentors[id].active});loadMentors()}catch(x){toast(x.message)}}
  const k=e.target.closest('[data-k]');if(k){const id=k.dataset.k;try{await api(`/admin/keys/${id}/revoke`,'POST',{active:k.dataset.a==='1'});loadKeys()}catch(x){toast(x.message)}}});
/* all keys */
async function loadKeys(){try{const ks=(await api('/admin/keys')).keys;const e=Object.entries(ks).sort((a,b)=>b[1].created-a[1].created);
  $('#klist').innerHTML=e.length?e.map(([k,v])=>{const exp=v.days!=null&&v.activated&&Date.now()>v.activated+v.days*864e5;const st=!v.active?'Revoked':exp?'Expired':v.device?'Activated':'Unused';
  return `<div class="row"><div class="m"><b style="font-family:ui-monospace,monospace">${k}</b><small>${esc(v.client)} · ${esc(v.ea||'—')} · ${v.plan} · <span class="${st==='Unused'||st==='Activated'?'on-t':'off-t'}">${st}</span></small></div><button class="pill" data-k="${k}" data-a="${v.active?0:1}">${v.active?'Revoke':'Restore'}</button></div>`}).join(''):'<p class="lbl">No keys yet</p>'}catch(e){}}
</script></body></html>
